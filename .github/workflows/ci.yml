name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

      - run: go vet ./...
      - run: go build ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      # v8 installs golangci-lint v2, which is what .golangci.yml is written
      # for. v6 installs v1, and v1 refuses a config targeting a newer Go than
      # it was built with.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.6.2

  dogfood:
    # metron measures itself. A tool that reports on code quality has no
    # standing if its own code would not pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: build
        run: go build -o /tmp/metron ./cmd/metron

      - name: measure this change
        if: github.event_name == 'pull_request'
        run: |
          /tmp/metron --since origin/${{ github.base_ref }} --axes complexity,mutation \
            --budget 10m --fail-on headline

      - name: measure the whole repository
        if: github.event_name == 'push'
        run: /tmp/metron --all --axes complexity --fail-on headline
