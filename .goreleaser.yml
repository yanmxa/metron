version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/metron
    binary: metron
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  # No version in the name, so install.sh can fetch
  # releases/latest/download/metron_<os>_<arch>.tar.gz without first asking
  # what the latest version is.
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
