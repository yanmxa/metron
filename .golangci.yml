version: "2"

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - bodyclose

  settings:
    staticcheck:
      checks: ["all"]

  exclusions:
    rules:
      # Table-driven tests read better without error wrapping on every helper.
      - path: _test\.go
        linters: [errcheck]

formatters:
  enable:
    - gofmt
